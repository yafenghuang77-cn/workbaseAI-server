server:
  port: 8082

mysql:
  host: 127.0.0.1
  port: 3306
  database: "app"
  username: "admin"
  password: "admin"

spring:
  datasource:
    url: "jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}"
    username: ${mysql.username}
    password: ${mysql.password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      username: "admin"
      password: "admin"
      connect-timeout: 3s
      timeout: 2s
