# 应用名称，用于标识当前服务。
spring.application.name=workbasket-server

# 所有 HTTP 接口共用的路径前缀，例如 /workbase/health。
server.servlet.context-path=/workbase

# 启动时未指定环境，则加载本地开发配置 application-dev.yaml。
spring.profiles.default=dev

# 关闭 Spring MVC 的 ProblemDetail 格式，HTTP 错误使用 /error 的响应格式。
spring.mvc.problemdetails.enabled=false

# /error 响应省略原始异常消息，前端从 errMessage 读取 HTTP 状态描述。
spring.web.error.include-message=never

# /error 响应省略异常堆栈，并覆盖 DevTools 的默认配置。
spring.web.error.include-stacktrace=never
